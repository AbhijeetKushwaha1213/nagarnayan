version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Nagar Nayan — docker-compose.yml
#
# Phase 1: backend service only.
# Phase 2 will add:
#   - db       (postgres:16 + PostGIS)
#   - redis    (optional caching / pub-sub)
#   - ai-service (the separate AI Video Intelligence Service)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nagarnayan-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Nagar Nayan Backend}"
      APP_ENV: "${APP_ENV:-development}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_VERSION: "${APP_VERSION:-0.1.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      # DATABASE_URL is intentionally omitted until Phase 2.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

