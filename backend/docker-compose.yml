version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Nagar Nayan — docker-compose.yml  (Phase 2)
#
# Services:
#   db       — PostgreSQL 16 + PostGIS
#   backend  — FastAPI application
#
# Future:
#   redis      (caching / pub-sub)
#   ai-service (separate AI Video Intelligence Service)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: nagarnayan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nagarnayan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
      POSTGRES_DB: "${POSTGRES_DB:-nagar_nayan}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nagarnayan} -d ${POSTGRES_DB:-nagar_nayan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nagarnayan-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Nagar Nayan Backend}"
      APP_ENV: "${APP_ENV:-development}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      APP_VERSION: "${APP_VERSION:-0.2.0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-nagarnayan}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-nagar_nayan}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Future: AI Video Intelligence Service ─────────────────────────────────
  # ai-service:
  #   image: nagarnayan/ai-service:latest
  #   container_name: nagarnayan-ai
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ...

volumes:
  pgdata:
    name: nagarnayan-pgdata
